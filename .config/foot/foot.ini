#----------------------------------------------------------
#-- HACK: Foot config
#----------------------------------------------------------

#  INFO: Theme
include=/home/imad/.config/foot/colorscheme.ini

#  INFO: Font
font=JetBrainsMono Nerd Font:size=10

#  INFO: Shell
shell=zsh

#  INFO: Padding
pad=5x5

#  INFO: Cursor shape & Animation
[cursor]
style=block
blink=no
beam-thickness=1.5
underline-thickness=2

#  INFO: Scrollback
[scrollback]
lines=10000
multiplier=3.0

#  INFO: Mouse
[mouse]
hide-when-typing=no

#  INFO: Keybinds
[key-bindings]
# Scroll page
scrollback-up-page=Shift+Page_Up Shift+KP_Page_Up Control+Shift+k
scrollback-down-page=Shift+Page_Down Shift+KP_Page_Down Control+Shift+j

# Scroll to top/bottom of history
scrollback-home=Control+Shift+Home
scrollback-end=Control+Shift+End

spawn-terminal=Control+Shift+n
quit=Control+Shift+q

# ctrl+x -> no_op
noop=Control+x
